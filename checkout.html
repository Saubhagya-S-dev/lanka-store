<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Lanka Store | Checkout</title>

<link
    rel="stylesheet"
    href="css/style.css"
>

</head>

<body>

<header class="navbar">

<div class="container nav-inner">

<a
    href="index.html"
    class="logo"
>

<span class="logo-mark">
    🛍️
</span>

Lanka Store

</a>


<a
    href="cart.html"
    class="btn btn-light"
>
    ← Cart
</a>

</div>

</header>


<main class="page">

<div
    class="container"
    style="max-width:800px;"
>

<div class="section-head">

<span class="badge">
    Checkout
</span>

<h2>
    Delivery Details
</h2>

</div>


<div class="card">

<form id="checkoutForm">

<div class="form-grid">


<div class="form-group">

<label>
    Full Name *
</label>

<input
    class="input"
    id="name"
    required
>

</div>


<div class="form-group">

<label>
    Phone *
</label>

<input
    class="input"
    id="phone"
    required
>

</div>


<div class="form-group">

<label>
    Email
</label>

<input
    class="input"
    id="email"
    type="email"
>

</div>


<div class="form-group full">

<label>
    Delivery Address *
</label>

<textarea
    class="textarea"
    id="address"
    rows="4"
    required
></textarea>

</div>

</div>


<div class="total-box">

<span>
    Order Total
</span>

<span id="checkoutTotal">
    Rs. 0
</span>

</div>


<br>


<button
    class="btn btn-primary"
    type="submit"
>
    Place Order
</button>

</form>


<div id="checkoutMessage"></div>

</div>

</div>

</main>


<script src="js/store.js"></script>

<script>

document.addEventListener(
    "DOMContentLoaded",
    () => {

        const total =
            cart.reduce(
                (sum, item) =>
                    sum + item.price * item.qty,
                0
            );


        document
            .getElementById("checkoutTotal")
            .textContent = money(total);


        if (cart.length === 0) {

            document
                .getElementById("checkoutForm")
                .innerHTML = `
                    <div class="empty">
                        Your cart is empty.
                        <br><br>
                        <a
                            href="index.html"
                            class="btn btn-primary"
                        >
                            Go Shopping
                        </a>
                    </div>
                `;

        }

    }
);


document
.getElementById("checkoutForm")
.addEventListener(
    "submit",
    async event => {

        event.preventDefault();


        const total =
            cart.reduce(
                (sum, item) =>
                    sum + item.price * item.qty,
                0
            );


        const order = {

            name:
                document
                .getElementById("name")
                .value
                .trim(),

            email:
                document
                .getElementById("email")
                .value
                .trim(),

            phone:
                document
                .getElementById("phone")
                .value
                .trim(),

            address:
                document
                .getElementById("address")
                .value
                .trim(),

            total: total,

            items: cart

        };


        try {

            const response =
                await fetch(
                    "backend/process-order.php",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify(order)
                    }
                );


            const data =
                await response.json();


            if (!data.success) {

                throw new Error(
                    data.message
                );

            }


            const demoOrders =
                JSON.parse(
                    localStorage.getItem(
                        "demoOrders"
                    ) || "[]"
                );


            demoOrders.push({

                tracking:
                    data.tracking_code,

                name:
                    order.name,

                total:
                    money(total),

                status:
                    "Processing"

            });


            localStorage.setItem(
                "demoOrders",
                JSON.stringify(demoOrders)
            );


            localStorage.removeItem(
                "lankaCart"
            );


            document
                .getElementById(
                    "checkoutMessage"
                )
                .innerHTML = `

                    <div
                        class="card"
                        style="margin-top:20px;"
                    >

                        <h3>
                            ✅ Order placed!
                        </h3>

                        <p>
                            Your tracking number:
                        </p>

                        <h2>
                            ${data.tracking_code}
                        </h2>

                        <br>

                        <a
                            href="tracking.html"
                            class="btn btn-primary"
                        >
                            Track Order
                        </a>

                    </div>
                `;


            document
                .getElementById(
                    "checkoutForm"
                )
                .style.display = "none";


        } catch (error) {

            document
                .getElementById(
                    "checkoutMessage"
                )
                .innerHTML = `

                    <p
                        style="
                        color:#b91c1c;
                        margin-top:15px;
                        "
                    >
                        ${
                            error.message ||
                            "Something went wrong."
                        }
                    </p>

                `;

        }

    }
);

</script>

</body>
</html>
