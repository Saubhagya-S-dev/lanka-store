<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Lanka Store | Cart</title>

<link
    rel="stylesheet"
    href="css/style.css"
>

</head>

<body>

<header class="navbar">

<div class="container nav-inner">

<a
    class="logo"
    href="index.html"
>

<span class="logo-mark">
    🛍️
</span>

Lanka Store

</a>


<a
    href="index.html"
    class="btn btn-light"
>
    ← Continue Shopping
</a>

</div>

</header>


<main class="page">

<div class="container">

<div class="section-head">

<h2>
    Your Shopping Cart
</h2>

<p>
    Review your items before checkout.
</p>

</div>


<div class="card">

<div id="cartItems"></div>


<div class="total-box">

<span>
    Total
</span>

<span id="cartTotal">
    Rs. 0
</span>

</div>


<br>


<a
    href="checkout.html"
    id="checkoutBtn"
    class="btn btn-primary"
>
    Proceed to Checkout
</a>

</div>

</div>

</main>


<script src="js/store.js"></script>

<script>

function renderCart() {

    const box =
        document.getElementById("cartItems");

    const totalElement =
        document.getElementById("cartTotal");


    if (cart.length === 0) {

        box.innerHTML = `
            <div class="empty">

                <h3>
                    Your cart is empty
                </h3>

                <br>

                <a
                    href="index.html"
                    class="btn btn-primary"
                >
                    Start Shopping
                </a>

            </div>
        `;

        totalElement.textContent =
            "Rs. 0";

        return;
    }


    box.innerHTML =
        cart.map(item => {

            return `
                <div class="cart-item">

                    <img
                        src="${item.image}"
                        alt="${item.name}"
                    >

                    <div>

                        <strong>
                            ${item.name}
                        </strong>

                        <div>
                            ${money(item.price)}
                        </div>

                    </div>


                    <div class="qty">

                        <button
                            onclick="changeQty(${item.id}, -1)"
                        >
                            −
                        </button>

                        <strong>
                            ${item.qty}
                        </strong>

                        <button
                            onclick="changeQty(${item.id}, 1)"
                        >
                            +
                        </button>

                    </div>


                    <button
                        class="btn btn-danger"
                        onclick="removeItem(${item.id})"
                    >
                        Remove
                    </button>

                </div>
            `;

        }).join("");


    const total =
        cart.reduce(
            (sum, item) =>
                sum + item.price * item.qty,
            0
        );


    totalElement.textContent =
        money(total);
}


function changeQty(id, amount) {

    const item =
        cart.find(item => item.id === id);

    if (!item) return;

    item.qty += amount;

    if (item.qty <= 0) {

        cart =
            cart.filter(item => item.id !== id);

    }

    saveCart();

    renderCart();
}


function removeItem(id) {

    cart =
        cart.filter(item => item.id !== id);

    saveCart();

    renderCart();
}


document.addEventListener(
    "DOMContentLoaded",
    renderCart
);

</script>

</body>
</html>
