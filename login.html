<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Lanka Store | Login</title>

<link
    rel="stylesheet"
    href="css/style.css"
>

</head>

<body>

<main class="page">

<div
    class="container"
    style="max-width:480px;"
>

<div class="card">

<div class="section-head">

<span class="badge">
    Admin Access
</span>

<h2>
    Welcome Back
</h2>

<p>
    Login to Lanka Store dashboard.
</p>

</div>


<form id="loginForm">

<div class="form-group">

<label>
    Email
</label>

<input
    class="input"
    id="email"
    type="email"
    placeholder="admin@lankastore.com"
    required
>

</div>


<div class="form-group">

<label>
    Password
</label>

<input
    class="input"
    id="password"
    type="password"
    placeholder="••••••••"
    required
>

</div>


<button
    type="submit"
    class="btn btn-primary"
    style="width:100%;"
>
    Login
</button>

</form>


<p
    style="
    margin-top:18px;
    color:#64748b;
    font-size:13px;
    "
>
    Demo Login:
    <br>
    admin@lankastore.com
    <br>
    admin123
</p>


<br>

<a href="index.html">
    ← Back to Store
</a>

</div>

</div>

</main>

<script src="js/auth.js"></script>

</body>
</html>
